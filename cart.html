<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Cart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #6b7280;
        }

        .cart-container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto 60px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .book-info {
            flex: 1;
        }

        .book-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .book-price {
            color: #4f46e5;
            font-weight: bold;
        }

        .quantity {
            margin-top: 8px;
            color: #6b7280;
        }

        .remove-btn {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 40px 20px;
        }

        .empty a {
            display: inline-block;
            margin-top: 15px;
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">📚 BookNest</div>
    <a href="index.html" class="back">← Continue Shopping</a>
</nav>

<section class="hero">
    <h1>Your Shopping Cart 🛒</h1>
    <p>Review your books before checkout.</p>
</section>

<div class="cart-container">

    <div class="card">

        <div id="cartItems"></div>

        <div class="total">
            <span>Total</span>
            <span id="cartTotal">₹0</span>
        </div>

        <a href="checkout.html" class="checkout-btn">
            Proceed to Checkout
        </a>

    </div>

</div>

<script>

    let cart = JSON.parse(localStorage.getItem("booknestCart")) || [];

    function displayCart() {

        const cartItems = document.getElementById("cartItems");
        const cartTotal = document.getElementById("cartTotal");

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty">
                    <h2>Your cart is empty 🛒</h2>
                    <a href="index.html">Continue Shopping</a>
                </div>
            `;

            cartTotal.textContent = "₹0";
            return;
        }

        let total = 0;

        cartItems.innerHTML = cart.map((book, index) => {

            const price = Number(book.price) || 0;
            const quantity = Number(book.quantity) || 1;

            total += price * quantity;

            return `
                <div class="book-item">

                    <div class="book-info">

                        <div class="book-name">
                            ${book.title || "Book"}
                        </div>

                        <div class="book-price">
                            ₹${price.toFixed(2)}
                        </div>

                        <div class="quantity">
                            Quantity: ${quantity}
                        </div>

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">
                        Remove
                    </button>

                </div>
            `;

        }).join("");

        cartTotal.textContent = "₹" + total.toFixed(2);
    }


    function removeItem(index) {

        cart.splice(index, 1);

        localStorage.setItem(
            "booknestCart",
            JSON.stringify(cart)
        );

        displayCart();
    }


    displayCart();

</script>

</body>
</html>
