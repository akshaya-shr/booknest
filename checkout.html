<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #6b7280;
        }

        .checkout-container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto 60px;
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #6366f1;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .summary {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .book-name {
            font-weight: bold;
        }

        .book-price {
            color: #4f46e5;
            font-weight: bold;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            margin-top: 22px;
        }

        .place-order {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .secure {
            text-align: center;
            color: #16a34a;
            margin-top: 15px;
            font-size: 14px;
        }

        .empty {
            color: #6b7280;
            text-align: center;
            padding: 20px 0;
        }

        @media (max-width: 800px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">📚 BookNest</div>
    <a href="cart.html" class="back">← Back to Cart</a>
</nav>

<section class="hero">
    <h1>Complete Your Order 🛍️</h1>
    <p>Almost there! Enter your details and place your order.</p>
</section>

<div class="checkout-container">

    <!-- CUSTOMER DETAILS -->
    <div class="card">
        <h2>🚚 Delivery Details</h2>

        <form id="checkoutForm">

            <div class="row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="customerName" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea id="address" required></textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" required>
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="pincode" required>
                </div>
            </div>

            <div class="form-group">
                <label>Payment Method</label>

                <select id="paymentMethod" required>
                    <option value="">Select Payment Method</option>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Credit / Debit Card</option>
                </select>
            </div>

            <button type="submit" class="place-order">
                Place Order 🚀
            </button>

        </form>
    </div>


    <!-- ORDER SUMMARY -->
    <div class="card summary">

        <h2>🛒 Order Summary</h2>

        <div id="orderItems">
            <div class="empty">Loading your cart...</div>
        </div>

        <div class="total">
            <span>Total</span>
            <span id="totalAmount">₹0</span>
        </div>

        <div class="secure">
            🔒 Your order information is secure
        </div>

    </div>

</div>


<script>

    let cart = JSON.parse(localStorage.getItem("booknestCart")) || [];

    function displayCart() {

        const container = document.getElementById("orderItems");

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    Your cart is empty.
                </div>
            `;

            document.getElementById("totalAmount").textContent = "₹0";
            return;
        }

        let total = 0;

        container.innerHTML = cart.map(book => {

            const price = Number(book.price) || 0;
            const quantity = Number(book.quantity) || 1;

            total += price * quantity;

            return `
                <div class="book-item">
                    <div>
                        <div class="book-name">
                            ${book.title || "Book"}
                        </div>

                        <small>
                            Quantity: ${quantity}
                        </small>
                    </div>

                    <div class="book-price">
                        ₹${(price * quantity).toFixed(2)}
                    </div>
                </div>
            `;

        }).join("");

        document.getElementById("totalAmount").textContent =
            "₹" + total.toFixed(2);
    }


    document.getElementById("checkoutForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        const total = cart.reduce((sum, book) => {
            return sum + (Number(book.price) || 0) * (Number(book.quantity) || 1);
        }, 0);

        const order = {

            customerName:
                document.getElementById("customerName").value,

            email:
                document.getElementById("email").value,

            phone:
                document.getElementById("phone").value,

            address:
                document.getElementById("address").value,

            city:
                document.getElementById("city").value,

            pincode:
                document.getElementById("pincode").value,

            paymentMethod:
                document.getElementById("paymentMethod").value,

            totalAmount: total,

            items: JSON.stringify(cart)

        };


        try {

            const response = await fetch("/api/orders", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(order)

            });


            if (!response.ok) {
                throw new Error("Order failed");
            }


            const savedOrder = await response.json();


            localStorage.removeItem("booknestCart");


            window.location.href =
                "order-success.html?id=" + savedOrder.id;


        } catch (error) {

            console.error(error);

            alert(
                "Unable to place the order right now. Please make sure the Spring Boot server is running."
            );

        }

    });


    displayCart();

</script>

</body>
</html>
